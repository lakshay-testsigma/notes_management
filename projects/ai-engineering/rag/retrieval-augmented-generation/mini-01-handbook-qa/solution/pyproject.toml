[project]
name = "handbook-qa"
version = "0.1.0"
description = "Mini project: answer handbook questions with a cited section, or refuse."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.pytest.ini_options]
# The source files live in src/, so tests can write `from chunking import ...`.
pythonpath = ["src"]
testpaths = ["tests"]
