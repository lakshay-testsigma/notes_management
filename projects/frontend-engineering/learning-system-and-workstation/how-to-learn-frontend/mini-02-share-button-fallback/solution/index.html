<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Share button fallback</title>
  </head>
  <body>
    <main>
      <h1>Feature detection: a Share button</h1>
      <p>This page stands in for a blog post. Press the button to share it.</p>
      <button id="share-button" type="button">Share this post</button>
      <p id="share-status" role="status" aria-live="polite"></p>
      <p id="share-link-box" hidden>
        <label for="share-link">Copy this link:</label>
        <input id="share-link" type="text" readonly size="40" />
      </p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
