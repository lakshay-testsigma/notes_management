<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
  <title id="t">Raft write path, end to end</title>
  <desc id="d">A client sends a write to the leader. The leader appends it to its log and replicates it to two followers. After one follower acknowledges, a majority of three stores the entry, so the leader commits, applies, and replies.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="2" color="#8a887f">
    <path d="M120 150 H228" marker-end="url(#arrow)"/>
    <path d="M372 130 L478 72" marker-end="url(#arrow)"/>
    <path d="M372 170 L478 228" marker-end="url(#arrow)"/>
    <path d="M478 92 L372 146" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
    <path d="M228 176 H120" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">
    <rect x="20" y="120" width="100" height="60" rx="30" fill="none" stroke="#2a78d6" stroke-width="2"/>
    <text x="70" y="155">Client</text>
    <rect x="230" y="110" width="140" height="80" rx="8" fill="none" stroke="#2a78d6" stroke-width="3"/>
    <text x="300" y="145" font-weight="bold">Leader</text>
    <text x="300" y="168" font-size="13">append, commit, apply</text>
    <rect x="480" y="40" width="140" height="64" rx="8" fill="none" stroke="#8a887f" stroke-width="2"/>
    <text x="550" y="77">Follower 1</text>
    <rect x="480" y="196" width="140" height="64" rx="8" fill="none" stroke="#8a887f" stroke-width="2"/>
    <text x="550" y="233">Follower 2</text>
    <text x="174" y="140" font-size="13">1. write</text>
    <text x="410" y="88" font-size="13">2. AppendEntries</text>
    <text x="410" y="218" font-size="13">2. AppendEntries</text>
    <text x="452" y="134" font-size="13">3. ack</text>
    <text x="174" y="200" font-size="13">4. reply after majority</text>
  </g>
</svg>
