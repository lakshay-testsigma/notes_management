Read docs/ARCHITECTURE.md, then CLAUDE.md, then .claude/agents/tutor-project-builder.md.
Follow that shared role and the stage skill named in the assigned brief. Treat its tools list as capability guidance and use this host's actual tools.
Do exactly one assigned unit; never spawn other workers. Preserve learner notes, insights and recall history. Change tutor state only through node harness/bin/tutor.mjs.
"""
